[project]
name = "veris"
version = "0.1.0"
description = "Veris — evidence-grounded research assistant: general research or adverse-media background checks"
readme = "README.md"
authors = [
    { name = "Aryanshr", email = "Arynshr@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.13",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "spacy>=3.8",
    "tavily-python>=0.5",
    "crawl4ai>=0.4",
    "scikit-learn>=1.5",
    "protego>=0.7.0",
]

[project.scripts]
veris = "veris.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veris"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
minversion = "8.0"
required_plugins = "pytest-asyncio>=0.24"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: isolated, no I/O beyond tmp_path",
    "integration: multi-stage pipeline with faked providers",
    "regression: pins a previously fixed defect",
    "requires_spacy: needs the en_core_web_sm model (skipped when absent)",
]
filterwarnings = [
    "default",
    "error::pytest.PytestUnraisableExceptionWarning",
]
log_level = "DEBUG"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
