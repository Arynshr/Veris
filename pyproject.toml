[project]
name = "veris"
version = "0.1.0"
description = "Veris — evidence-grounded research assistant: general research or adverse-media background checks"
readme = "README.md"
authors = [
    { name = "Aryanshr", email = "Arynshr@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.13",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "spacy>=3.8",
    "groq>=0.11",
    "tavily-python>=0.5",
    "crawl4ai>=0.4",
    "scikit-learn>=1.5",
]

[project.scripts]
veris = "veris.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veris"]

[tool.uv]
package = true
